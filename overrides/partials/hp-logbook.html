<section class="hp-logbook" aria-label="Lab progress">
  <div class="hp-logbook__icon">{% include ".icons/material/anchor.svg" %}</div>
  <div class="hp-logbook__body">
    <p class="hp-logbook__title">Log this voyage</p>
    <p class="hp-logbook__text">Tick every checkpoint above, or mark the lab complete when you're done. Progress is saved in this browser only.</p>
    <div class="hp-progress"><span class="hp-progress__bar" data-hp-page></span></div>
  </div>
  <button type="button" class="hp-btn hp-btn--brass" data-hp-complete>Mark lab complete</button>
</section>
