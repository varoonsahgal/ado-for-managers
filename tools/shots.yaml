# Screenshot captions. `bar` = where in Azure DevOps (shown in the frame's title bar).
# `caption` = what to notice (Markdown allowed). Keep captions to one or two sentences.

lab01-epics-backlog:
  bar: "Boards › Backlogs › HarborPoint Team › Epics"
  caption: "Six Epics in portfolio order. Row 6 carries **Priority 1** and the `mandatory` tag, and it's ranked last."

lab02-mobile-velocity:
  bar: "Boards › Backlogs › Mobile Banking › Analytics › Velocity"
  caption: "Mobile Banking, Sum of Story Points. Sprint 13 was planned at **62** and completed **44**. Sprint 14 is still in flight, so most of its bar is Incomplete."

lab04-velocity-mobile:
  bar: "Boards › Backlogs › Mobile Banking › Analytics › Velocity"
  caption: "Completed points climb from 33 to 45, then dip to **44** against **62** planned in Sprint 13. Planned grows faster than Completed every sprint."

lab06-velocity-points-vs-count:
  bar: "Boards › Backlogs › Mobile Banking › Analytics › Velocity (points, then count)"
  caption: "The same five sprints, measured two ways. By **Sum of Story Points** (left), completed climbs 33 → 45. By **Count of Work Items** (right), it stays at **12 or 13 stories** a sprint. The team isn't faster; the yardstick grew."

lab06-cfd-mobile:
  bar: "Boards › Backlogs › Mobile Banking › Analytics › Cumulative Flow Diagram (80 days)"
  caption: "Each band is a board column. The mid-blue **Resolved** band, finished code waiting for a tester, is a sliver in September and six items thick by November."

lab01-digital-features-rollup:
  bar: "Boards › Backlogs › Digital Portfolio › Features (Parents on, three rollup columns)"
  caption: "The Epic reads **58% of 455 points**, but its six visible Features add up to 348. The other 107 points are two Closed Features the backlog hides. Note `Spending Insights` at **88%** and `Real-Time Fraud Alerts` at **4%**."

lab01-f2-work-item-form:
  bar: "Work item form › Feature › Mobile Check Deposit 2.0"
  caption: "Lens 2, the form: **Risk 1 - High**, the `at-risk` tag, and a **Target Date** at the end of *this* sprint. The Discussion shows who raised the flag, and when."

lab01-program-plan-f2:
  bar: "Boards › Delivery Plans › HarborPoint Program Plan"
  caption: "Lens 4, the calendar: `Mobile Check Deposit 2.0` ends a few days after **today**. The three markers (System Demo, PI 5 Planning, exam fieldwork) put every card in context, and `Real-Time Fraud Alerts` carries a **red** dependency badge."

lab02-program-plan-f9-badge:
  bar: "Boards › Delivery Plans › HarborPoint Program Plan › Dependencies (red badge on Real-Time Fraud Alerts)"
  caption: "The predecessor, `Fraud Scoring Engine v2`, now targets **1/1/2027**, the end of Sprint 17. That's two weeks after Fraud Alerts is due, so the row is flagged red."

lab07-dependencies-dialog:
  bar: "Boards › Delivery Plans › Dependencies for Real-Time Fraud Alerts"
  caption: "One red Feature-level conflict, and beneath it the **story-level** truth: two Mobile stories planned in Sprints 14 and 15 depend on an API that lands in **Sprint 16**. The green row (Unified Notification Service) is fine."

lab01-mobile-stories-resolved:
  bar: "Boards › Boards › Mobile Banking › Stories"
  caption: "Three stories, **11 points** of finished code, sit in Resolved waiting for the team's only tester, with Resolved bugs queuing behind them. Notice the column headers too: **16/5** and **6/5** in red mean both columns are far over their work-in-progress limit."

lab01-f9-children-by-area:
  bar: "Boards › Backlogs › HarborPoint Team › Features › Real-Time Fraud Alerts expanded"
  caption: "One Feature, three builders. **Node Name** shows seven stories in Mobile Banking (30 points), two in Security (13) and two in Core Platform (8). Mobile's bugs ride along in the same tree."

lab02-current-sprint-by-feature:
  bar: "Boards › Queries › Shared Queries › HarborPoint Reports › Program - Current sprint (all teams)"
  caption: "Mobile Banking's Sprint 14, with **Parent** added. Five stories (12 points) have no Feature at all: two `unplanned` asks, two `tech-debt` upgrades and a polish task."

lab02-f2-children-iterations:
  bar: "Boards › Backlogs › Mobile Banking › Features › Mobile Check Deposit 2.0 expanded"
  caption: "The team's own plan already says *no*: **14 points sit in Sprint 15**, after the Feature's due date. In Sprint 14, one story has no owner, two haven't started, and the Priority 1 bug at the bottom has no one assigned."

lab02-stale-query:
  bar: "Boards › Queries › My Queries › Scratch - stale work"
  caption: "Four clauses, two answers. Both stories belong to Ethan Brooks, both serve the Feature due this sprint, and neither has been touched in over a week."

lab03-q1-tree:
  bar: "Boards › Queries › Shared Queries › Training › P## › 01 What is my team working on (by Feature)"
  caption: "Three Features with 14 stories nested beneath them, and then **five stories hanging loose at the bottom**, with no Feature above them. That's 12 points of this sprint serving no part of the portfolio."

lab03-q6-orphans:
  bar: "Boards › Queries › Shared Queries › Training › P## › 06 Orphan work (Work items and direct links)"
  caption: "The one query type that can ask *what's missing*: **Only return items that do not have matching links**, with only **Parent** ticked. Five stories, 12 points: two `unplanned` asks and two `tech-debt` upgrades."

lab03-q4-editor:
  bar: "Boards › Queries › Shared Queries › Training › P## › 04 Features at risk › Editor"
  caption: "The bracket beside **Target Date** marks a group: three **Or** alternatives joined to the rest by one **And**. Without it, the Or clauses leak and closed Features flood the list."

lab03-q4-results:
  bar: "Boards › Queries › Shared Queries › Training › P## › 04 Features at risk › Results"
  caption: "Eight Features, sorted by Target Date. `Agent Knowledge Base` is still Active a month past its date. `Real-Time Fraud Alerts`, the portfolio's top priority, is here only because someone set **Risk**: it has no `at-risk` tag."

lab03-toolkit-folder:
  bar: "Boards › Queries › All › Shared Queries › Training › P##"
  caption: "The finished toolkit: eight questions, numbered in reading order, in a shared folder where dashboards can use them. The icons tell you the query type at a glance: flat, tree or direct links."

start-env-shared-queries:
  bar: "Boards › Queries › All"
  caption: "Shared Queries holds three folders: **HarborPoint Reports** (ready-made program views), **PMO Reporting** (Leo's queries, which you'll audit on Day 3) and **Training**, where your `P##` folder lives."

lab04-features-pie:
  bar: "Boards › Queries › Shared Queries › Training › P## › 10 Digital Features (chart) › Charts"
  caption: "Nine Features by Area Path: five Active, two Closed, two New. Lab 1 counted *eight* under the Epic. The ninth is `Real-Time Fraud Alerts`, built by a Digital team but serving another Epic."

lab04-sprint-pivot:
  bar: "Boards › Queries › Shared Queries › Training › P## › 11 Digital stories this sprint (chart) › Charts"
  caption: "Two charts on one query. Mobile Banking has **Closed 12** of its 65 points with **11 more sitting in Resolved**; Digital Accounts has closed 10 of 26 with nothing queued for test."

lab05-create-dialog:
  bar: "Overview › Dashboards › + New Dashboard"
  caption: "A **project** dashboard belongs to you, not to a team's admins. Tick auto-refresh so the page is never stale, and keep the name **under 32 characters** or the dialog won't let you create it."

lab04-bug-trend:
  bar: "Overview › Dashboards › Burndown widget · Mobile Banking · Bugs · weekly since Sprint 9"
  caption: "Open Mobile Banking bugs, week by week: **9 at the start of Sprint 9, 42 today.** The orange Total Scope line keeps pulling away from the bars, so bugs are being filed faster than they're fixed."

lab06-bug-trend:
  bar: "Overview › Dashboards › Burndown widget · Mobile Banking · Bugs · weekly since Sprint 9"
  caption: "The quality signal behind the rising velocity: open bugs more than quadrupled in five sprints, and the climb steepened in Sprint 13."

lab04-status-report:
  bar: "Overview › Wiki › Training › P## › Sprint Delivery Report"
  caption: "A model one-pager: a colour **with a sentence**, scope and as-of stated up front, a Feature table, three evidenced risks and a live query table. Typing `#1365` turned into a live link to the Feature."

lab05-query-tile-config:
  bar: "Overview › Dashboards › P## - Digital Command Center › Edit › Query Tile › Configuration"
  caption: "Two **conditional formatting** rules turn a count into a signal: amber from 1, red from 5. A count of 6 matches both, and the tile shows red. List your rules from mild to severe."

lab05-velocity-config:
  bar: "Overview › Dashboards › P## - Digital Command Center › Edit › Velocity › Configuration"
  caption: "**Team** is the field that matters most, and the widget never shows it unless you put it in the title. Set Team first, then name the widget after it."

lab05-command-center-full:
  bar: "Overview › Dashboards › P## - Digital Command Center"
  caption: "Top row: *is anything on fire?* Second row: *where are the Features?* Below: the diagnostics. Every team-scoped widget names its team in the title, and the tiles read **3 / 18 / 1 / 6**."

lab05-exec-view:
  bar: "Overview › Dashboards › P## - Digital Banking Exec View"
  caption: "Six widgets, and the most important one is words: a **bottom line** and the **decision needed**. Everything else is evidence for that sentence."

lab06-cycle-time-pair:
  bar: "Overview › Dashboards › P## - Digital Command Center › Cycle Time · two teams"
  caption: "Same widget, two teams. Mobile's moving average climbs from about 3 days to about 9, and its shaded spread widens. Digital Accounts holds at 4 to 5 days. (Watch the axes: they differ.)"
