dashboards:
  - name: "HarborPoint Program Overview"
    description: "Program-level view of Project Lighthouse: priorities, Feature schedule, and quality signals."
    team: null
    widgets:
      - type: markdown
        title: "Project Lighthouse"
        row: 1
        column: 1
        row_span: 2
        column_span: 4
        markdown: |-
          ## Project Lighthouse (METP)
          **FY2027 priorities**
          1. Protect every member (Fraud Detection & Security)
          2. Digital that feels human (Digital Banking Modernization)
          3. Effortless support (Customer Support Modernization)
          4. Branches as relationship hubs (Branch Experience Transformation)

          Enabler: Platform Foundations · Mandatory: Compliance: Examination Readiness

          **Key events:** PI 4 System Demo (end of Sprint 16) · PI 5 Planning (start of Sprint 17) · Exam fieldwork (Sprint 18)

          **Links:** Wiki > Program > [Program Charter](../../_wiki/wikis/HarborPoint.wiki?pagePath=/Program/Program%20Charter) · [PI 4 Objectives](../../_wiki/wikis/HarborPoint.wiki?pagePath=/Program/PI%204%20Objectives) · Delivery Plan: **HarborPoint Program Plan**
      - type: query_tile
        title: "Open P1 bugs (program)"
        row: 1
        column: 5
        row_span: 1
        column_span: 1
        query: "Shared Queries/HarborPoint Reports/Program - Open P1 bugs"
        rules:
          - {op: ">", value: 0, color: "#cc293d"}
      - type: query_tile
        title: "Features due in next 3 weeks (incl. overdue)"
        row: 1
        column: 6
        row_span: 1
        column_span: 1
        query: "Shared Queries/HarborPoint Reports/Portfolio - Features due in next 3 weeks"
        rules:
          - {op: ">", value: 0, color: "#fbbd08"}
      - type: query_tile
        title: "Open bugs (program)"
        row: 2
        column: 5
        row_span: 1
        column_span: 1
        query: "Shared Queries/HarborPoint Reports/Program - Open bugs"
      - type: chart
        title: "Features by State"
        row: 1
        column: 7
        row_span: 2
        column_span: 2
        query: "Shared Queries/HarborPoint Reports/Portfolio - Features by target date"
        chart: {type: pie, group_by: "System.State"}
      - type: chart
        title: "Open bugs by area"
        row: 1
        column: 9
        row_span: 2
        column_span: 2
        query: "Shared Queries/HarborPoint Reports/Program - Open bugs"
        chart: {type: bar, group_by: "System.AreaPath"}
      - type: query_results
        title: "Portfolio - Features by target date"
        row: 3
        column: 1
        row_span: 4
        column_span: 10
        query: "Shared Queries/HarborPoint Reports/Portfolio - Features by target date"

  - name: "Member Support - Delivery Health"
    description: "Member Support delivery metrics for the PMO weekly pack. Maintained by Leo Fischer, PMO."
    team: "Member Support"
    widgets:
      - type: markdown
        title: "Member Support - Delivery Health"
        row: 1
        column: 1
        row_span: 2
        column_span: 3
        markdown: |-
          ## Member Support - Delivery Health
          Weekly PMO view of Member Support delivery.

          **Maintained by Leo Fischer, PMO.** Questions? Contact Leo.
      - type: query_tile
        title: "Current sprint work"
        row: 1
        column: 4
        row_span: 1
        column_span: 1
        query: "Shared Queries/PMO Reporting/MS - Current sprint work"
      - type: query_tile
        title: "Completed this sprint"
        row: 1
        column: 5
        row_span: 1
        column_span: 1
        query: "Shared Queries/PMO Reporting/MS - Completed this sprint"
      - type: query_tile
        title: "Open P1 bugs"
        row: 1
        column: 6
        row_span: 1
        column_span: 1
        query: "Shared Queries/PMO Reporting/MS - Open P1 bugs"
        rules:
          - {op: ">", value: 0, color: "#cc293d"}
          - {op: "=", value: 0, color: "#339933"}
      - type: query_tile
        title: "Open work"
        row: 1
        column: 7
        row_span: 1
        column_span: 1
        query: "Shared Queries/PMO Reporting/MS - Open work"
        rules:
          - {op: ">", value: 25, color: "#cc293d"}
      - type: query_tile
        title: "Omnichannel stories"
        row: 1
        column: 8
        row_span: 1
        column_span: 1
        query: "Shared Queries/PMO Reporting/MS - Omnichannel stories"
      - type: query_tile
        title: "Waiting for sign-off"
        row: 2
        column: 4
        row_span: 1
        column_span: 1
        query: "My Queries/MS - Waiting for sign-off"
      - type: chart
        title: "Omnichannel stories by state"
        row: 1
        column: 9
        row_span: 2
        column_span: 2
        query: "Shared Queries/PMO Reporting/MS - Omnichannel stories"
        chart: {type: pie, group_by: "System.State"}
      - type: velocity
        title: "Velocity"
        row: 3
        column: 1
        row_span: 2
        column_span: 4
        team: "Member Support"
      - type: sprint_burndown
        title: "Sprint burndown (current sprint)"
        row: 3
        column: 5
        row_span: 2
        column_span: 4
        team: "Member Support"
        iteration: 'PI 4\Sprint 13'

delivery_plans:
  - name: "HarborPoint Program Plan"
    description: "All six delivery teams at Feature level, with PI and regulatory milestones."
    teams:
      - {team: "Mobile Banking", backlog: "Microsoft.FeatureCategory"}
      - {team: "Digital Accounts", backlog: "Microsoft.FeatureCategory"}
      - {team: "Security", backlog: "Microsoft.FeatureCategory"}
      - {team: "Core Platform", backlog: "Microsoft.FeatureCategory"}
      - {team: "Branch Experience", backlog: "Microsoft.FeatureCategory"}
      - {team: "Member Support", backlog: "Microsoft.FeatureCategory"}
    markers:
      - {sprint: "Sprint 16", at: end, label: "PI 4 System Demo", color: "#0078d4"}
      - {sprint: "Sprint 17", at: start, label: "PI 5 Planning", color: "#8661c5"}
      - {sprint: "Sprint 18", at: start, label: "Regulatory exam fieldwork", color: "#cc293d"}
    card_fields:
      - System.AssignedTo
      - System.State
      - System.Tags
      - Microsoft.VSTS.Scheduling.StartDate
      - Microsoft.VSTS.Scheduling.TargetDate
      - Microsoft.VSTS.Common.Priority
      - Microsoft.VSTS.Common.Risk
