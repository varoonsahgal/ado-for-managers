# HarborPoint pre-built artifacts (World Bible section 8).
# Merged verbatim into the dataset ("artifacts") by the generator and applied by the provisioner.
# Tokens allowed in WIQL: {project}, {participant}, {sandbox_area}.
# Area/iteration paths are full paths starting with the project name.

query_folders:
  - path: "Shared Queries/HarborPoint Reports"
  - path: "Shared Queries/PMO Reporting"
  - path: "Shared Queries/Training"
    grant_contributors: true
  - path: "Shared Queries/Training/{participant}"
    per_participant: true
  - path: "Shared Queries/Training/{participant}/Lab 11 - Inherited queries"
    per_participant: true

queries:
  # ---------------------------------------------------------------- HarborPoint Reports (good examples)
  - path: "Shared Queries/HarborPoint Reports"
    name: "Portfolio - Epics and Features"
    wiql: |-
      SELECT [System.Id], [System.WorkItemType], [System.Title], [System.State], [System.AssignedTo],
             [System.AreaPath], [Microsoft.VSTS.Scheduling.StartDate], [Microsoft.VSTS.Scheduling.TargetDate],
             [Microsoft.VSTS.Common.Priority], [System.Tags]
      FROM WorkItemLinks
      WHERE ([Source].[System.TeamProject] = @project
             AND [Source].[System.WorkItemType] = 'Epic'
             AND [Source].[System.State] <> 'Removed'
             AND [Source].[System.AreaPath] NOT UNDER 'HarborPoint\Training')
        AND ([System.Links.LinkType] = 'System.LinkTypes.Hierarchy-Forward')
        AND ([Target].[System.TeamProject] = @project
             AND [Target].[System.WorkItemType] = 'Feature'
             AND [Target].[System.State] <> 'Removed')
      ORDER BY [Microsoft.VSTS.Common.StackRank] ASC, [System.Id] ASC
      MODE (Recursive)

  - path: "Shared Queries/HarborPoint Reports"
    name: "Portfolio - Features by target date"
    wiql: |-
      SELECT [System.Id], [System.Title], [System.State], [System.AssignedTo], [System.AreaPath],
             [System.IterationPath], [Microsoft.VSTS.Scheduling.StartDate], [Microsoft.VSTS.Scheduling.TargetDate],
             [Microsoft.VSTS.Common.Priority], [System.Tags]
      FROM WorkItems
      WHERE [System.TeamProject] = @project
        AND [System.WorkItemType] = 'Feature'
        AND [System.State] <> 'Removed'
        AND [System.AreaPath] NOT UNDER 'HarborPoint\Training'
      ORDER BY [Microsoft.VSTS.Scheduling.TargetDate] ASC, [Microsoft.VSTS.Common.Priority] ASC

  - path: "Shared Queries/HarborPoint Reports"
    name: "Portfolio - Features due in next 3 weeks"
    wiql: |-
      SELECT [System.Id], [System.Title], [System.State], [System.AssignedTo], [System.AreaPath],
             [Microsoft.VSTS.Scheduling.TargetDate], [Microsoft.VSTS.Common.Priority], [System.Tags]
      FROM WorkItems
      WHERE [System.TeamProject] = @project
        AND [System.WorkItemType] = 'Feature'
        AND [System.State] NOT IN ('Closed', 'Removed')
        AND [Microsoft.VSTS.Scheduling.TargetDate] <= @Today + 21
        AND [System.AreaPath] NOT UNDER 'HarborPoint\Training'
      ORDER BY [Microsoft.VSTS.Scheduling.TargetDate] ASC

  - path: "Shared Queries/HarborPoint Reports"
    name: "Program - Current sprint (all teams)"
    wiql: |-
      SELECT [System.Id], [System.WorkItemType], [System.Title], [System.State], [System.AssignedTo],
             [System.AreaPath], [Microsoft.VSTS.Scheduling.StoryPoints], [System.Tags]
      FROM WorkItems
      WHERE [System.TeamProject] = @project
        AND [System.WorkItemType] IN ('User Story', 'Bug')
        AND [System.IterationPath] = @CurrentIteration('[HarborPoint]\HarborPoint Team')
        AND [System.AreaPath] NOT UNDER 'HarborPoint\Training'
      ORDER BY [System.AreaPath] ASC, [Microsoft.VSTS.Common.StackRank] ASC

  - path: "Shared Queries/HarborPoint Reports"
    name: "Program - Open bugs"
    wiql: |-
      SELECT [System.Id], [System.Title], [System.State], [System.AssignedTo], [System.AreaPath],
             [Microsoft.VSTS.Common.Priority], [Microsoft.VSTS.Common.Severity], [System.Tags]
      FROM WorkItems
      WHERE [System.TeamProject] = @project
        AND [System.WorkItemType] = 'Bug'
        AND [System.State] NOT IN ('Closed', 'Removed')
        AND [System.AreaPath] NOT UNDER 'HarborPoint\Training'
      ORDER BY [Microsoft.VSTS.Common.Priority] ASC, [Microsoft.VSTS.Common.Severity] ASC

  - path: "Shared Queries/HarborPoint Reports"
    name: "Program - Open P1 bugs"
    wiql: |-
      SELECT [System.Id], [System.Title], [System.State], [System.AssignedTo], [System.AreaPath],
             [Microsoft.VSTS.Common.Priority], [Microsoft.VSTS.Common.Severity], [System.Tags]
      FROM WorkItems
      WHERE [System.TeamProject] = @project
        AND [System.WorkItemType] = 'Bug'
        AND [Microsoft.VSTS.Common.Priority] = 1
        AND [System.State] NOT IN ('Closed', 'Removed')
        AND [System.AreaPath] NOT UNDER 'HarborPoint\Training'
      ORDER BY [Microsoft.VSTS.Common.Severity] ASC, [System.AreaPath] ASC

  # ---------------------------------------------------------------- PMO Reporting (Leo Fischer; deliberately flawed, Lab 11)
  - path: "Shared Queries/PMO Reporting"
    name: "MS - Current sprint work"
    wiql: |-
      SELECT [System.Id], [System.WorkItemType], [System.Title], [System.State], [System.AssignedTo],
             [Microsoft.VSTS.Scheduling.StoryPoints], [System.Tags]
      FROM WorkItems
      WHERE [System.TeamProject] = @project
        AND [System.AreaPath] UNDER 'HarborPoint\Member Support'
        AND [System.IterationPath] = 'HarborPoint\PI 4\Sprint 13'
      ORDER BY [System.State] ASC, [System.Id] ASC

  - path: "Shared Queries/PMO Reporting"
    name: "MS - Completed this sprint"
    wiql: |-
      SELECT [System.Id], [System.WorkItemType], [System.Title], [System.State], [System.AssignedTo],
             [Microsoft.VSTS.Scheduling.StoryPoints]
      FROM WorkItems
      WHERE [System.TeamProject] = @project
        AND [System.AreaPath] UNDER 'HarborPoint\Member Support'
        AND [System.IterationPath] = 'HarborPoint\PI 4\Sprint 13'
        AND [System.State] = 'Closed'
      ORDER BY [System.Id] ASC

  - path: "Shared Queries/PMO Reporting"
    name: "MS - Open P1 bugs"
    wiql: |-
      SELECT [System.Id], [System.Title], [System.State], [System.AssignedTo],
             [Microsoft.VSTS.Common.Priority], [Microsoft.VSTS.Common.Severity]
      FROM WorkItems
      WHERE [System.TeamProject] = @project
        AND [System.WorkItemType] = 'Bug'
        AND [System.AreaPath] UNDER 'HarborPoint\Member Support'
        AND [Microsoft.VSTS.Common.Priority] = 1
        AND [System.State] <> 'Closed'
      ORDER BY [System.Id] ASC

  - path: "Shared Queries/PMO Reporting"
    name: "MS - Open work"
    wiql: |-
      SELECT [System.Id], [System.WorkItemType], [System.Title], [System.State], [System.AssignedTo],
             [System.IterationPath], [Microsoft.VSTS.Scheduling.StoryPoints]
      FROM WorkItems
      WHERE [System.TeamProject] = @project
        AND [System.AreaPath] UNDER 'HarborPoint\Member Support'
        AND [System.State] <> 'Closed'
      ORDER BY [System.WorkItemType] ASC, [System.Id] ASC

  - path: "Shared Queries/PMO Reporting"
    name: "MS - Omnichannel stories"
    wiql: |-
      SELECT [System.Id], [System.Title], [System.State], [System.AssignedTo],
             [Microsoft.VSTS.Scheduling.StoryPoints], [System.Tags]
      FROM WorkItems
      WHERE [System.TeamProject] = @project
        AND [System.AreaPath] UNDER 'HarborPoint\Member Support'
        AND [System.Tags] CONTAINS 'omnichannel'
      ORDER BY [System.State] ASC, [System.Id] ASC

  # ---------------------------------------------------------------- Planted problem #12 (optional): private query
  # Saved in the PROVISIONING USER's "My Queries" (stands in for Leo's private folder). The tile bound to it on
  # the shared Member Support dashboard shows a permissions error to every other viewer.
  - path: "My Queries"
    name: "MS - Waiting for sign-off"
    private: true
    wiql: |-
      SELECT [System.Id], [System.Title], [System.State], [System.AssignedTo],
             [Microsoft.VSTS.Scheduling.StoryPoints], [System.ChangedDate]
      FROM WorkItems
      WHERE [System.TeamProject] = @project
        AND [System.AreaPath] UNDER 'HarborPoint\Member Support'
        AND [System.WorkItemType] = 'User Story'
        AND [System.State] = 'Resolved'
      ORDER BY [System.ChangedDate] ASC

  # ---------------------------------------------------------------- Per-participant flawed copies (Lab 11 sandbox)
  - path: "Shared Queries/Training/{participant}/Lab 11 - Inherited queries"
    name: "Current sprint work"
    per_participant: true
    wiql: |-
      SELECT [System.Id], [System.WorkItemType], [System.Title], [System.State], [System.AssignedTo],
             [Microsoft.VSTS.Scheduling.StoryPoints], [System.Tags]
      FROM WorkItems
      WHERE [System.TeamProject] = @project
        AND [System.AreaPath] UNDER '{sandbox_area}'
        AND [System.IterationPath] = 'HarborPoint\PI 4\Sprint 13'
      ORDER BY [System.State] ASC, [System.Id] ASC

  - path: "Shared Queries/Training/{participant}/Lab 11 - Inherited queries"
    name: "Completed this sprint"
    per_participant: true
    wiql: |-
      SELECT [System.Id], [System.WorkItemType], [System.Title], [System.State], [System.AssignedTo],
             [Microsoft.VSTS.Scheduling.StoryPoints]
      FROM WorkItems
      WHERE [System.TeamProject] = @project
        AND [System.AreaPath] UNDER '{sandbox_area}'
        AND [System.IterationPath] = 'HarborPoint\PI 4\Sprint 13'
        AND [System.State] = 'Closed'
      ORDER BY [System.Id] ASC

  - path: "Shared Queries/Training/{participant}/Lab 11 - Inherited queries"
    name: "Open P1 bugs"
    per_participant: true
    wiql: |-
      SELECT [System.Id], [System.Title], [System.State], [System.AssignedTo],
             [Microsoft.VSTS.Common.Priority], [Microsoft.VSTS.Common.Severity]
      FROM WorkItems
      WHERE [System.TeamProject] = @project
        AND [System.WorkItemType] = 'Bug'
        AND [System.AreaPath] UNDER '{sandbox_area}'
        AND [Microsoft.VSTS.Common.Priority] = 1
        AND [System.State] <> 'Closed'
      ORDER BY [System.Id] ASC

  - path: "Shared Queries/Training/{participant}/Lab 11 - Inherited queries"
    name: "Open work"
    per_participant: true
    wiql: |-
      SELECT [System.Id], [System.WorkItemType], [System.Title], [System.State], [System.AssignedTo],
             [System.IterationPath], [Microsoft.VSTS.Scheduling.StoryPoints]
      FROM WorkItems
      WHERE [System.TeamProject] = @project
        AND [System.AreaPath] UNDER '{sandbox_area}'
        AND [System.State] <> 'Closed'
      ORDER BY [System.WorkItemType] ASC, [System.Id] ASC

  - path: "Shared Queries/Training/{participant}/Lab 11 - Inherited queries"
    name: "Omnichannel stories"
    per_participant: true
    wiql: |-
      SELECT [System.Id], [System.Title], [System.State], [System.AssignedTo],
             [Microsoft.VSTS.Scheduling.StoryPoints], [System.Tags]
      FROM WorkItems
      WHERE [System.TeamProject] = @project
        AND [System.AreaPath] UNDER '{sandbox_area}'
        AND [System.Tags] CONTAINS 'omnichannel'
      ORDER BY [System.State] ASC, [System.Id] ASC

